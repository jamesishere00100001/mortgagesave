# Mortgage Save web calculator (mortgagesave.very-good-studio.com).
# start.sh fills in $PORT.
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  map $sent_http_content_type $html_cache {
    ~^text/html  "no-cache";
    default      "public, max-age=3600";
  }

  server {
    listen $PORT;
    root /srv/public;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
      default_type text/html;
      return 404 '<!doctype html><meta charset="utf-8"><title>Not found</title><p>Page not found. <a href="/">Mortgage overpayment calculator</a></p>\n';
    }

    # The subdomain is DNS-only in Cloudflare, so HSTS has to come from here.
    # The page's own script and JSON-LD are inline, hence 'unsafe-inline' for scripts.
    add_header Cache-Control $html_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
